name: Fix basic marker alignment

on:
  push:
    branches:
      - agent/add-last-check-page
    paths:
      - .github/workflows/fix-basic-marker-align.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-last-check-page

      - name: Replace absolute marker positioning with grid alignment
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("last-check.css")
          text = path.read_text(encoding="utf-8")

          desktop_pattern = re.compile(
              r'\.last-check-basic-list li \{\n'
              r'  position: relative;\n'
              r'  padding: 11px 12px 11px 34px;\n'
              r'  line-height: 1\.7;\n'
              r'  background: rgba\(230, 221, 210, \.045\);\n'
              r'  border-bottom: 1px solid var\(--line-soft\);\n'
              r'\}\n\n'
              r'\.last-check-basic-list li::before \{\n'
              r'  position: absolute;\n'
              r'  top: 1\.05em;\n'
              r'  left: 12px;\n'
              r'  width: 8px;\n'
              r'  height: 8px;\n'
              r'  content: "";\n'
              r'  background: var\(--accent\);\n'
              r'  transform: rotate\(45deg\);\n'
              r'\}'
          )

          desktop_replacement = '''.last-check-basic-list li {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr);
            align-items: center;
            column-gap: 14px;
            padding: 11px 12px;
            line-height: 1.7;
            background: rgba(230, 221, 210, .045);
            border-bottom: 1px solid var(--line-soft);
          }

          .last-check-basic-list li::before {
            width: 8px;
            height: 8px;
            content: "";
            background: var(--accent);
            transform: rotate(45deg);
          }'''

          text, desktop_count = desktop_pattern.subn(desktop_replacement, text, count=1)
          assert desktop_count == 1, "desktop marker block must exist exactly once"

          mobile_pattern = re.compile(
              r'  \.last-check-basic-list li \{\n'
              r'    padding: 10px 8px 10px 29px;\n'
              r'  \}\n\n'
              r'  \.last-check-basic-list li::before \{\n'
              r'    left: 9px;\n'
              r'  \}'
          )

          mobile_replacement = '''  .last-check-basic-list li {
            column-gap: 12px;
            padding: 10px 8px;
          }'''

          text, mobile_count = mobile_pattern.subn(mobile_replacement, text, count=1)
          assert mobile_count == 1, "mobile marker block must exist exactly once"

          path.write_text(text, encoding="utf-8")

      - name: Validate
        shell: bash
        run: |
          grep -q 'grid-template-columns: 8px minmax(0, 1fr);' last-check.css
          grep -q 'align-items: center;' last-check.css
          ! grep -q 'top: 1.05em;' last-check.css
          ! grep -q 'left: 9px;' last-check.css
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-check.css
          git commit -m "最重要項目のマーカーをGridで中央揃え"
          git push origin HEAD:agent/add-last-check-page
