name: Use chevron disclosure

on:
  push:
    branches:
      - agent/refine-archive-home
    paths:
      - .github/workflows/use-chevron-disclosure.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-archive-home

      - name: Replace plus-minus with chevrons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          text = path.read_text(encoding='utf-8')

          old = '''.archive-disclosure summary::after {
            position: absolute;
            top: 50%;
            right: 20px;
            content: "＋";
            font-size: 1.2rem;
            line-height: 1;
            transform: translateY(-50%);
          }

          .archive-disclosure[open] summary::after {
            content: "−";
          }'''

          new = '''.archive-disclosure summary::after {
            position: absolute;
            top: 50%;
            right: 22px;
            width: 10px;
            height: 10px;
            content: "";
            border-right: 2px solid var(--ink);
            border-bottom: 2px solid var(--ink);
            transform: translateY(-65%) rotate(45deg);
          }

          .archive-disclosure[open] summary::after {
            transform: translateY(-35%) rotate(-135deg);
          }'''

          if old not in text:
              raise SystemExit('Disclosure icon source block not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          ! grep -q 'content: "＋"' style.css
          ! grep -q 'content: "−"' style.css
          grep -q 'rotate(45deg)' style.css
          grep -q 'rotate(-135deg)' style.css

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "質問集の折り畳みアイコンを矢印へ統一"
          git push origin HEAD:agent/refine-archive-home
