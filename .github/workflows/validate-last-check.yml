name: Validate last check

on:
  push:
    branches:
      - agent/add-last-check-page
    paths:
      - last-check.js
      - last-check.css
      - script.js
      - .github/workflows/validate-last-check.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check last-check.js

      - name: Static assertions
        shell: bash
        run: |
          test "$(grep -c '<details class=\"archive-disclosure last-check-disclosure\">' last-check.js)" -eq 9
          grep -q 'data-go=\"lastcheck\"' last-check.js
          grep -q 'data-view=\"lastcheck\"' last-check.js
          grep -q 'LAST CHECK / BEFORE INTERVIEW' last-check.js
          grep -q '時間がなければ、ここまで読めば十分です。' last-check.js
          grep -q '御社（おんしゃ）' last-check.js
          grep -q '御校（おんこう）' last-check.js
          grep -q '目の前の人と、ちゃんと話してこよう。' last-check.js
          grep -q 'loadScript("last-check.js"' script.js
          grep -q 'window.InterviewLastCheck?.installShell' script.js
          grep -q 'window.InterviewLastCheck?.initialize' script.js
          grep -q 'last-check-disclosure' last-check.css
          grep -q 'last-check-sendoff' last-check.css

      - name: Diff check
        run: git diff --check origin/main...HEAD -- last-check.js last-check.css script.js
