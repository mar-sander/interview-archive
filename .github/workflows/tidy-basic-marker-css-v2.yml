name: Tidy basic marker CSS v2

on:
  push:
    branches:
      - agent/add-last-check-page
    paths:
      - .github/workflows/tidy-basic-marker-css-v2.yml

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-last-check-page

      - name: Tidy mobile rule indentation
        run: python -c 'from pathlib import Path; p=Path("last-check.css"); s=p.read_text(encoding="utf-8"); old="  .last-check-basic-list li {\n  column-gap: 12px;\n  padding: 10px 8px;\n}"; new="  .last-check-basic-list li {\n    column-gap: 12px;\n    padding: 10px 8px;\n  }"; assert s.count(old)==1; p.write_text(s.replace(old,new),encoding="utf-8")'

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-check.css
          git commit -m "モバイル用マーカーCSSの整形を調整"
          git push origin HEAD:agent/add-last-check-page
