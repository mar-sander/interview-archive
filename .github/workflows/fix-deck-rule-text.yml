name: Fix deck rule text color

on:
  push:
    branches:
      - agent/add-answer-rule-intro
    paths:
      - .github/workflows/fix-deck-rule-text.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-answer-rule-intro

      - name: Apply scoped text color fix
        shell: bash
        run: |
          if grep -q 'RULE 00 bright text fix' deck/style.css; then
            echo 'Fix already exists'
            exit 1
          fi
          cat >> deck/style.css <<'CSS'

          /* RULE 00 bright text fix */
          .section-block[aria-labelledby="deckAnswerRuleTitle"] .talk-guide p {
            color: var(--accent);
            overflow-wrap: normal;
            line-break: strict;
            word-break: normal;
          }

          .section-block[aria-labelledby="deckAnswerRuleTitle"] .talk-guide p strong {
            color: var(--ink);
          }
          CSS

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -n -A12 'RULE 00 bright text fix' deck/style.css

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deck/style.css
          git commit -m "DECKのRULE 00本文色を読みやすく修正"
          git push origin HEAD:agent/add-answer-rule-intro
