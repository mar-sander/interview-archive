name: Fix archive disclosure design

on:
  push:
    branches:
      - agent/fix-archive-disclosure-design
    paths:
      - .github/workflows/fix-archive-disclosure-design.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-archive-disclosure-design

      - name: Apply boxed disclosure design
        shell: bash
        run: |
          cat >> style.css <<'CSS'

          /* ===== HOME disclosure visual correction ===== */
          .archive-disclosure {
            margin-top: 14px;
            background: rgba(76, 74, 71, .94);
            border: 1px solid var(--ink);
            box-shadow: 4px 4px 0 var(--shadow);
          }

          .archive-disclosure > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            width: 100%;
            padding: 15px 20px;
            color: var(--ink);
            font-weight: 700;
            cursor: pointer;
            list-style: none;
            background: var(--surface-2);
          }

          .archive-disclosure > summary::marker {
            content: "";
            display: none;
          }

          .archive-disclosure > summary::-webkit-details-marker {
            display: none;
          }

          .archive-disclosure > summary::after {
            flex: 0 0 auto;
            width: .58rem;
            height: .58rem;
            content: "";
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(45deg);
            transition: transform .16s ease;
          }

          .archive-disclosure[open] > summary::after {
            transform: rotate(225deg);
          }

          .archive-disclosure > summary:hover {
            background: rgba(98, 93, 88, .78);
          }

          .archive-disclosure[open] > summary {
            border-bottom: 1px solid var(--line-soft);
          }
          CSS

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q 'HOME disclosure visual correction' style.css
          grep -q 'display: flex;' style.css
          grep -q 'rotate(45deg)' style.css
          grep -q 'rotate(225deg)' style.css

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "質問集の折り畳み表示を枠付き形式へ統一"
          git push origin HEAD:agent/fix-archive-disclosure-design
